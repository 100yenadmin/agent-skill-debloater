name: Release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - run: npm test
      - run: npm run eval:routing
      - run: npm run eval:rerank
      - run: npm run smoke:fresh-agents -- --report fresh-agent-smokes.json
      - run: node bin/pack-sync check
      - run: npm run smoke:openclaw-adapter
      - run: npm run acceptance:clean-room -- --report clean-room-install.json
      - run: npm run acceptance:package -- --report package-acceptance.json
      - run: git diff --check
      - run: npm run release:check
      - run: node src/release-report.mjs notes > release-notes.md
      - run: npm pack --dry-run --json > npm-pack-dry-run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-preflight
          path: |
            release-notes.md
            npm-pack-dry-run.json
            fresh-agent-smokes.json
            clean-room-install.json
            package-acceptance.json
